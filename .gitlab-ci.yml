# labdeck – GitLab CI
#
# Jeder Push:        nur Tests (test-go, test-web)
# Tag vX.Y.Z:        Tests + Image bauen und pushen als X.Y.Z und X.Y
# Kein :main, kein :latest – Version wird auf dem Server fest in .env gesetzt.

stages:
  - test
  - release

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ---------- test ----------

test-go:
  stage: test
  image: golang:1.27
  cache:
    key: go-mod
    paths: [.go/pkg/mod/]
  before_script:
    # go:embed braucht web/dist – für die Tests reicht ein Platzhalter
    - mkdir -p web/dist && [ -e web/dist/index.html ] || echo '<!doctype html>' > web/dist/index.html
  script:
    - go vet ./...
    - go test ./...

test-web:
  stage: test
  image: node:24
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm run build

# ---------- release (nur bei Tags) ----------

release-image:
  stage: release
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # BuildKit-Builder: pusht direkt in die Registry, nicht über den Docker-Daemon
    - docker buildx create --use --driver docker-container
  script:
    - VERSION="${CI_COMMIT_TAG#v}"          # v0.2.0 -> 0.2.0
    - MINOR="${VERSION%.*}"                  # 0.2.0  -> 0.2
    - echo "Baue $CI_REGISTRY_IMAGE:$VERSION und :$MINOR"
    # --provenance/--sbom=false: keine Attestation-Manifeste (sonst "blob unknown to registry")
    - >
      docker buildx build
      --provenance=false --sbom=false
      --build-arg VERSION="$VERSION"
      -t "$CI_REGISTRY_IMAGE:$VERSION"
      -t "$CI_REGISTRY_IMAGE:$MINOR"
      --push .