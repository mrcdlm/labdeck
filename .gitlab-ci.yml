# labdeck – GitLab CI
#
# Die Pipeline läuft AUSSCHLIESSLICH bei einem neuen Versions-Tag vX.Y.Z.
# Push auf main/Branches, Merge Requests, manuelle Starts, Zeitpläne: KEINE Pipeline.
#
#   Release:  git tag v0.4.0 && git push origin v0.4.0
#   Ergebnis: registry.netvrkit.de/mrcdlm/labdeck:0.4.0
#
# Voraussetzungen:
#   - Tag muss geschützt sein (Settings → Repository → Protected tags: v*)
#   - Tag muss auf einem Commit liegen, der in main enthalten ist
#   Beides prüft der Job check-tag, sonst wird nichts veröffentlicht.
#
# Es gibt nur feste Versionen – kein :main, kein :latest, kein :0.4.
# Auf dem Server wird die Version fest in /opt/stacks/labdeck/.env gesetzt.

stages:
  - test
  - release

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - when: never

# ---------- test ----------

check-tag:
  stage: test
  image: alpine:3
  variables:
    GIT_DEPTH: 0                 # volle Historie für merge-base
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ "$CI_COMMIT_REF_PROTECTED" != "true" ]; then
        echo "Tag $CI_COMMIT_TAG ist nicht geschützt – Release abgebrochen."
        echo "Settings → Repository → Protected tags: v* eintragen."
        exit 1
      fi
    # Tag-Pipelines holen nur den Tag, main muss explizit nachgeladen werden
    - git fetch --no-tags origin "$CI_DEFAULT_BRANCH"
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD; then
        echo "Commit $CI_COMMIT_SHORT_SHA ist nicht in $CI_DEFAULT_BRANCH enthalten – Release abgebrochen."
        exit 1
      fi
    - echo "Tag $CI_COMMIT_TAG ist geschützt und liegt auf $CI_DEFAULT_BRANCH."

test-go:
  stage: test
  image: golang:1.27
  cache:
    key:
      files: [go.sum]
    paths:
      - .go/pkg/mod/
      - .cache/go-build/
  before_script:
    # go:embed braucht web/dist – für die Tests reicht ein Platzhalter
    - mkdir -p web/dist && [ -e web/dist/index.html ] || echo '<!doctype html>' > web/dist/index.html
  script:
    - go vet ./...
    - go test ./...

test-web:
  stage: test
  image: node:24
  cache:
    key:
      files: [web/package-lock.json]
    paths: [.npm/]
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm run build

# ---------- release (nur wenn alle Jobs in test grün sind) ----------
# Keine eigenen rules nötig: die workflow-Regel lässt ohnehin nur vX.Y.Z-Tags zu.

release-image:
  stage: release
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # BuildKit-Builder: pusht direkt in die Registry, nicht über den Docker-Daemon
    - docker buildx create --use --driver docker-container
  script:
    - VERSION="${CI_COMMIT_TAG#v}"          # v0.4.0 -> 0.4.0
    - echo "Baue $CI_REGISTRY_IMAGE:$VERSION"
    # --provenance/--sbom=false: keine Attestation-Manifeste (sonst "blob unknown to registry")
    - >
      docker buildx build
      --provenance=false --sbom=false
      --build-arg VERSION="$VERSION"
      -t "$CI_REGISTRY_IMAGE:$VERSION"
      --push .